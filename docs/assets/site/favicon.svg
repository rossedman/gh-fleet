<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 192 192" fill="none">
  <defs>
    <linearGradient id="lead" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b9fbf6"/>
      <stop offset="0.45" stop-color="#3DDBD9"/>
      <stop offset="1" stop-color="#22b3b0"/>
    </linearGradient>
    <linearGradient id="leadJib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EEFEA"/>
      <stop offset="1" stop-color="#2cc4c1"/>
    </linearGradient>
    <linearGradient id="leadHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EEFEA"/>
      <stop offset="1" stop-color="#1fa8a5"/>
    </linearGradient>
    <linearGradient id="mid" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#45c9c6"/>
      <stop offset="1" stop-color="#1b8f8f"/>
    </linearGradient>
    <linearGradient id="deep" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#27a0a1"/>
      <stop offset="1" stop-color="#14747c"/>
    </linearGradient>
    <linearGradient id="midHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38b5b3"/>
      <stop offset="1" stop-color="#167a7b"/>
    </linearGradient>
    <linearGradient id="deepHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8c8e"/>
      <stop offset="1" stop-color="#0f636b"/>
    </linearGradient>
  </defs>

  <!-- followers: deeper shades, one step back -->
  <g transform="translate(14 100)">
    <path d="M0 0 V64 H38 Z" fill="url(#mid)"/>
    <path d="M-8 69 H46 L39 80 H-1 Z" fill="url(#midHull)"/>
  </g>
  <g transform="translate(148 100)">
    <path d="M0 0 V64 H38 Z" fill="url(#deep)"/>
    <path d="M-8 69 H46 L39 80 H-1 Z" fill="url(#deepHull)"/>
  </g>
  <!-- lead: bright, and checked off -->
  <g transform="translate(72 20)">
    <path d="M0 0 V92 H56 Z" fill="url(#lead)"/>
    <path d="M-6 97 H62 L54 109 H2 Z" fill="url(#leadHull)"/>
  </g>
</svg>
