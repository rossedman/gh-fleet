name: guardrails

# The same gate Claude Code faces at Stop (.guardrails.yaml): on pull
# requests only what the change touched, on main every package.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --base needs the base branch's history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The released golangci-lint and govulncheck binaries are built with an
      # older Go than go.mod targets and refuse to load this module; build
      # them with its toolchain (same pins as the Makefile). Guardrails uses
      # tools on PATH first.
      - name: Go tools built with the module's toolchain
        run: |
          GOTOOLCHAIN="$(go env GOVERSION)" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          GOTOOLCHAIN="$(go env GOVERSION)" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - uses: rossedman/guardrails@5a8819d6b43c3fdb96e6dd280a52936e52d0e56e # v0.7.0
        with:
          version: 0.7.0
